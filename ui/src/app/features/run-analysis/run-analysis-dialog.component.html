<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [maximizable]="true"
  [style]="{ width: 'min(1120px,96vw)' }"
  [contentStyle]="{ height: 'min(680px,76vh)' }"
  (onMaximize)="dialogMaximized = $event.maximized"
>
  <ng-template #header>
    <div>
      <span class="eyebrow">Run values</span>
      <h2>{{ title }}</h2>
      <small>{{ context }}</small>
    </div>
  </ng-template>

  @if (loading) {
    <div class="state">
      <p-progress-spinner strokeWidth="4" ariaLabel="Loading run values" />
      <p>Running SPARQL queries…</p>
    </div>
  } @else if (error) {
    <p class="state error">{{ error }}</p>
  } @else if (analysis) {
    <p-tabs [value]="tab" (valueChange)="changeTab($event)">
      <p-tablist>
        <p-tab value="values">Values</p-tab>
        <p-tab value="plot">Plot</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="values">
          <app-run-values-grid
            [data]="analysis"
            [maximized]="dialogMaximized"
            (filteredRowsChange)="filteredRowsChanged($event)"
          />
        </p-tabpanel>
        <p-tabpanel value="plot">
          <app-comparison-plot
            [data]="analysis"
            [rows]="filteredRows"
            [maximized]="dialogMaximized"
          />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</p-dialog>
