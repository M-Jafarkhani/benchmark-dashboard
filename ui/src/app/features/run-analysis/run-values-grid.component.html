<div class="actions">
  <div class="column-legend" aria-label="Column type legend">
    <span><i class="parameter-swatch" aria-hidden="true"></i>Parameters</span>
    <span><i class="metric-swatch" aria-hidden="true"></i>Metrics</span>
  </div>
  <p-button
    label="Export CSV"
    icon="pi pi-download"
    size="small"
    [outlined]="true"
    [disabled]="!gridApi"
    (onClick)="exportCsv()"
  />
</div>

<ag-grid-angular
  class="values-grid"
  [class.maximized]="maximized()"
  [rowData]="data().rows"
  [columnDefs]="columnDefs()"
  [defaultColDef]="defaultColDef"
  (gridReady)="gridReady($event)"
  (filterChanged)="filterChanged($event)"
/>
